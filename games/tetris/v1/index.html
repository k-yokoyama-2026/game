<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>テトリス（オリジナル版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #12132a; color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 1rem 0.6rem; touch-action: none; user-select: none;
}
h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
.info { display: flex; gap: 1.4rem; margin-bottom: 0.6rem; font-size: 0.95rem; }
.info b { color: #ffd45e; }
#board {
  display: grid; gap: 2px; background: rgba(255,255,255,0.06);
  padding: 4px; border-radius: 8px;
  width: min(70vw, 280px); aspect-ratio: 1 / 2;
}
.cell { border-radius: 3px; background: rgba(255,255,255,0.05); }
.cell.on { box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), inset 0 2px 2px rgba(255,255,255,0.25); }
#pad { margin-top: 0.9rem; display: grid; grid-template-columns: repeat(4,1fr);
  gap: 0.5rem; width: min(92vw, 320px); }
.b { border: none; border-radius: 12px; padding: 0.8rem 0; font-size: 1.3rem;
  font-weight: 800; color: #fff; background: rgba(255,255,255,0.12); cursor: pointer; }
.b:active { transform: translateY(2px); }
.b.rot { background: #5a57e0; }
.b.drop { background: #f0a93b; color: #3a2a00; }
.home { margin-top: 0.9rem; font-size: 0.85rem; color: #b3b0d8; text-decoration: none; }
#over { position: fixed; inset: 0; background: rgba(10,9,25,0.85);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
#over.show { display: flex; }
#over h2 { font-size: 1.8rem; }
.btn { padding: 0.7rem 1.8rem; border: none; border-radius: 999px; font-size: 1rem;
  font-weight: 700; background: #5a57e0; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>🟦 テトリス</h1>
<div class="info"><div>スコア <b id="score">0</b></div><div>ライン <b id="lines">0</b></div><div>Lv <b id="level">1</b></div><div>ベスト <b id="best">0</b></div></div>
<div id="board"></div>
<div id="pad">
  <button class="b" id="bl">◀</button>
  <button class="b rot" id="br">⟳</button>
  <button class="b" id="bR">▶</button>
  <button class="b drop" id="bd">⤓</button>
  <button class="b" id="bD" style="grid-column: span 4;">▼ そっとおろす</button>
</div>
<a class="home" href="../../../">← ゲーム一覧へ</a>

<div id="over">
  <h2>ゲームオーバー</h2>
  <div>スコア <b id="fscore">0</b></div>
  <button class="btn" id="again">もう一度</button>
</div>

<script>
const COLS = 10, ROWS = 20;
const PIECES = {
  I: { c: '#4dd2ff', m: ['0000','1111','0000','0000'] },
  O: { c: '#ffd43b', m: ['11','11'] },
  T: { c: '#b083f0', m: ['010','111','000'] },
  S: { c: '#69db7c', m: ['011','110','000'] },
  Z: { c: '#ff6b6b', m: ['110','011','000'] },
  J: { c: '#4dabf7', m: ['100','111','000'] },
  L: { c: '#ffa94d', m: ['001','111','000'] },
};
const TYPES = Object.keys(PIECES);

function toM(rows){ return rows.map(r=>r.split('').map(ch=>ch==='1'?1:0)); }
function cellsOf(m){ const o=[]; for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c])o.push([r,c]); return o; }
function rotCW(m){ const n=m.length, o=Array.from({length:n},()=>Array(n).fill(0));
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)o[c][n-1-r]=m[r][c]; return o; }

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const linesEl = document.getElementById('lines');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');
let grid, cells, cur, score, lines, level, best, running, timer;

best = parseInt(localStorage.getItem('tetris_best') || '0', 10);
bestEl.textContent = best;

function build(){
  boardEl.style.gridTemplateColumns = `repeat(${COLS},1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${ROWS},1fr)`;
  boardEl.innerHTML = ''; cells = [];
  for(let r=0;r<ROWS;r++){ cells[r]=[]; for(let c=0;c<COLS;c++){
    const d=document.createElement('div'); d.className='cell'; boardEl.appendChild(d); cells[r][c]=d;
  }}
}
function makeGrid(){ return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }
function valid(m,row,col){
  for(const [dr,dc] of cellsOf(m)){ const rr=row+dr, cc=col+dc;
    if(cc<0||cc>=COLS||rr>=ROWS) return false;
    if(rr>=0 && grid[rr][cc]) return false; }
  return true;
}
function randType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }
function spawn(){
  const t = randType(); const m = toM(PIECES[t].m);
  cur = { m, color: PIECES[t].c, row: -1, col: Math.floor((COLS-m.length)/2) };
  if(!valid(cur.m, cur.row, cur.col)){ end(); }
}
function render(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=cells[r][c]; d.className='cell';
    if(grid[r][c]){ d.classList.add('on'); d.style.background=grid[r][c]; } else d.style.background='';
  }
  if(cur && running) for(const [dr,dc] of cellsOf(cur.m)){
    const rr=cur.row+dr, cc=cur.col+dc;
    if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS){ const d=cells[rr][cc]; d.classList.add('on'); d.style.background=cur.color; }
  }
}
function move(dx){ if(running&&valid(cur.m,cur.row,cur.col+dx)){ cur.col+=dx; render(); } }
function rotate(){ if(!running) return; const m2=rotCW(cur.m);
  for(const dc of [0,-1,1,-2,2]) if(valid(m2,cur.row,cur.col+dc)){ cur.m=m2; cur.col+=dc; render(); return; } }
function down(){ if(!running) return;
  if(valid(cur.m,cur.row+1,cur.col)){ cur.row++; render(); } else lock(); }
function drop(){ if(!running) return;
  while(valid(cur.m,cur.row+1,cur.col)){ cur.row++; score+=2; } scoreEl.textContent=score; render(); lock(); }
function lock(){
  for(const [dr,dc] of cellsOf(cur.m)){ const rr=cur.row+dr, cc=cur.col+dc;
    if(rr>=0&&rr<ROWS) grid[rr][cc]=cur.color; }
  clearLines(); spawn(); render();
}
function clearLines(){
  const kept = grid.filter(row=>!row.every(v=>v));
  const n = ROWS - kept.length;
  if(n>0){
    const table=[0,100,300,500,800];
    score += table[Math.min(4,n)] * level;
    lines += n; level = 1 + Math.floor(lines/10);
    while(kept.length<ROWS) kept.unshift(Array(COLS).fill(null));
    grid = kept;
    scoreEl.textContent=score; linesEl.textContent=lines; levelEl.textContent=level;
    restartTimer();
  }
}
function restartTimer(){ clearInterval(timer);
  timer = setInterval(()=>{ if(running) down(); }, Math.max(120, 800-(level-1)*70)); }
function newGame(){
  grid=makeGrid(); score=0; lines=0; level=1; running=true;
  scoreEl.textContent=0; linesEl.textContent=0; levelEl.textContent=1;
  document.getElementById('over').classList.remove('show');
  build(); spawn(); render(); restartTimer();
}
function end(){
  running=false; clearInterval(timer);
  if(score>best){ best=score; localStorage.setItem('tetris_best',best); bestEl.textContent=best; }
  document.getElementById('fscore').textContent=score;
  document.getElementById('over').classList.add('show');
}

document.getElementById('bl').onclick=()=>move(-1);
document.getElementById('bR').onclick=()=>move(1);
document.getElementById('br').onclick=rotate;
document.getElementById('bD').onclick=down;
document.getElementById('bd').onclick=drop;
document.getElementById('again').onclick=newGame;
window.addEventListener('keydown',e=>{
  if(!running) return;
  if(e.key==='ArrowLeft'){ move(-1); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ move(1); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ down(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ rotate(); e.preventDefault(); }
  else if(e.key===' '){ drop(); e.preventDefault(); }
});

newGame();
</script>
</body>
</html>
