<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>テトリス（オリジナル版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #12162a; color: #eee;
  display: flex; flex-direction: column; align-items: center;
  padding: 1rem; touch-action: none; user-select: none;
}
h1 { font-size: 1.3rem; margin-bottom: 0.4rem; }
.hud { display: flex; gap: 1.4rem; margin-bottom: 0.6rem; font-size: 0.95rem; }
.hud b { color: #ffd45e; }
canvas { background: #0a0d1c; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
.pad { display: grid; grid-template-columns: repeat(4, 60px); gap: 0.5rem; margin-top: 0.8rem; }
.pad button {
  border: none; border-radius: 10px; background: #2a3050; color: #eee;
  font-size: 1.3rem; padding: 0.7rem 0; cursor: pointer;
}
.pad button:active { background: #3a4470; }
.info { font-size: 0.75rem; color: #888; margin-top: 0.6rem; text-align: center; }
.home { margin-top: 0.8rem; font-size: 0.85rem; color: #9aa4d8; text-decoration: none; }
#over { position: fixed; inset: 0; background: rgba(10,12,25,0.85); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
#over.show { display: flex; }
#over button { padding: 0.7rem 1.8rem; font-size: 1rem; border: none; border-radius: 999px;
  background: #5a6fe0; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>🧱 テトリス</h1>
<div class="hud">スコア <b id="score">0</b>　行 <b id="lines">0</b>　レベル <b id="level">1</b></div>
<canvas id="cv" width="240" height="480"></canvas>
<div class="pad">
  <button id="l">◀</button>
  <button id="r">▶</button>
  <button id="rot">⟳</button>
  <button id="d">▼</button>
</div>
<div class="info">← → 移動 / ↑ 回転 / ↓ 落下 / Space 一気に落とす</div>
<a class="home" href="../../../">← ゲーム一覧へ</a>

<div id="over">
  <div style="font-size:1.6rem;font-weight:800">ゲームオーバー</div>
  <div>スコア <b id="fs" style="color:#ffd45e">0</b></div>
  <button id="again">もう一度</button>
</div>

<script>
const COLS = 10, ROWS = 20, SIZE = 24;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const COLORS = ['#4dd7f0','#ffd43b','#b06bf0','#69db7c','#ff6b6b','#4d7bf0','#ffa94d'];
// 各ミノ4回転ぶんの相対座標
const SHAPES = [
  [[[1,0],[1,1],[1,2],[1,3]],[[0,2],[1,2],[2,2],[3,2]],[[2,0],[2,1],[2,2],[2,3]],[[0,1],[1,1],[2,1],[3,1]]], // I
  [[[0,1],[0,2],[1,1],[1,2]],[[0,1],[0,2],[1,1],[1,2]],[[0,1],[0,2],[1,1],[1,2]],[[0,1],[0,2],[1,1],[1,2]]], // O
  [[[0,1],[1,0],[1,1],[1,2]],[[0,1],[1,1],[1,2],[2,1]],[[1,0],[1,1],[1,2],[2,1]],[[0,1],[1,0],[1,1],[2,1]]], // T
  [[[0,1],[0,2],[1,0],[1,1]],[[0,1],[1,1],[1,2],[2,2]],[[1,1],[1,2],[2,0],[2,1]],[[0,0],[1,0],[1,1],[2,1]]], // S
  [[[0,0],[0,1],[1,1],[1,2]],[[0,2],[1,1],[1,2],[2,1]],[[1,0],[1,1],[2,1],[2,2]],[[0,1],[1,0],[1,1],[2,0]]], // Z
  [[[0,0],[1,0],[1,1],[1,2]],[[0,1],[0,2],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,0],[2,1]]], // J
  [[[0,2],[1,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[1,2],[2,0]],[[0,0],[0,1],[1,1],[2,1]]], // L
];

let grid, cur, score, lines, level, dropTimer, gameOver;

function makeGrid(){ return Array.from({length:ROWS}, ()=>Array(COLS).fill(-1)); }
function spawn(){ const t = Math.floor(Math.random()*7); return { t, rot:0, r:0, c:3 }; }
function blocks(p){ return SHAPES[p.t][p.rot&3].map(([dr,dc])=>[p.r+dr,p.c+dc]); }
function collides(p){
  for(const [r,c] of blocks(p)){
    if(c<0||c>=COLS||r>=ROWS) return true;
    if(r>=0 && grid[r][c]>=0) return true;
  }
  return false;
}
function tryMove(dr,dc){
  const np = {t:cur.t, rot:cur.rot, r:cur.r+dr, c:cur.c+dc};
  if(!collides(np)){ cur=np; return true; }
  return false;
}
function rotate(){
  const nrot = (cur.rot+1)&3;
  for(const dc of [0,-1,1,-2,2]){
    const np = {t:cur.t, rot:nrot, r:cur.r, c:cur.c+dc};
    if(!collides(np)){ cur=np; return; }
  }
}
function lock(){
  for(const [r,c] of blocks(cur)) if(r>=0) grid[r][c]=cur.t;
  // ライン消去
  let cleared = 0;
  for(let r=ROWS-1;r>=0;r--){
    if(grid[r].every(v=>v>=0)){
      grid.splice(r,1); grid.unshift(Array(COLS).fill(-1));
      cleared++; r++;
    }
  }
  if(cleared>0){
    lines += cleared;
    score += [0,100,300,500,800][cleared] * level;
    level = 1 + Math.floor(lines/10);
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }
  document.getElementById('score').textContent = score;
  cur = spawn();
  if(collides(cur)) end();
}
function hardDrop(){ while(tryMove(1,0)){} lock(); }
function step(){ if(!tryMove(1,0)) lock(); draw(); }

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 積まれたブロック
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    if(grid[r][c]>=0) cell(r,c,COLORS[grid[r][c]]);
  // 現在のミノ
  for(const [r,c] of blocks(cur)) if(r>=0) cell(r,c,COLORS[cur.t]);
}
function cell(r,c,color){
  ctx.fillStyle = color;
  ctx.fillRect(c*SIZE+1, r*SIZE+1, SIZE-2, SIZE-2);
}

function end(){
  gameOver = true;
  clearInterval(dropTimer);
  document.getElementById('fs').textContent = score;
  document.getElementById('over').classList.add('show');
}

function start(){
  grid = makeGrid();
  score = 0; lines = 0; level = 1; gameOver = false;
  cur = spawn();
  document.getElementById('score').textContent = 0;
  document.getElementById('lines').textContent = 0;
  document.getElementById('level').textContent = 1;
  document.getElementById('over').classList.remove('show');
  clearInterval(dropTimer);
  dropTimer = setInterval(()=>{ if(!gameOver) step(); }, Math.max(120, 700 - (level-1)*60));
  draw();
}

document.addEventListener('keydown', e=>{
  if(gameOver) return;
  if(e.key==='ArrowLeft'){ tryMove(0,-1); draw(); }
  else if(e.key==='ArrowRight'){ tryMove(0,1); draw(); }
  else if(e.key==='ArrowDown'){ step(); }
  else if(e.key==='ArrowUp'){ rotate(); draw(); }
  else if(e.key===' '){ hardDrop(); draw(); e.preventDefault(); }
});
function tap(id, fn){ document.getElementById(id).addEventListener('click', ()=>{ if(!gameOver){ fn(); draw(); } }); }
tap('l', ()=>tryMove(0,-1));
tap('r', ()=>tryMove(0,1));
tap('rot', ()=>rotate());
tap('d', ()=>step());
document.getElementById('again').addEventListener('click', start);

start();
</script>
</body>
</html>
